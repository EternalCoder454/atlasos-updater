[workspace]
resolver = "3"
members = ["crates/telamon-update-engine", "crates/telamon-updater-base", "apps/telamon-updater", "apps/telamon-updater-tray"]

[workspace.package]
version = "0.3.0"
edition = "2024"
license = "MIT"
repository = "https://github.com/EternalCoder454/atlasos-updater"
rust-version = "1.89"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
