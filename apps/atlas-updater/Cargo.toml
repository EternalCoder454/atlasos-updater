[package]
name = "atlas-updater"
description = "Atlas Updater: system updates for AtlasOS (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "atlas_updater"
crate-type = ["staticlib", "rlib"]

[features]
# Honour ATLAS_UPDATER_FIXTURES in a release build (screenshots, UI tests).
fixtures = []

[dependencies]
# The update engine (the system helper's client and the progress parser).
atlas-update-engine = { path = "../../crates/atlas-update-engine" }
# What Atlas apps share. Pinned: move the rev forward on purpose, together
# with crates/atlas-update-engine's.
atlas-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "bf9acc1a0d638dad25be535d58b809b0c1371f20" }
atlas-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "bf9acc1a0d638dad25be535d58b809b0c1371f20" }
atlas-framework-flatpak = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "bf9acc1a0d638dad25be535d58b809b0c1371f20" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Release notes: parsed here, rendered by notes.rs from an allow-list.
pulldown-cmark = { version = "0.13", default-features = false }
# Release notes: small blocking client, run on a worker thread.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"
