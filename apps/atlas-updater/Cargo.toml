[package]
name = "atlas-updater"
description = "Atlas Updater: system updates for AtlasOS (Kirigami UI over CXX-Qt)"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
build = "build.rs"

# CMake (Corrosion) links the static library into the C++ executable.
# `rlib` is there so `cargo test` and `cargo clippy` work as usual.
[lib]
name = "atlas_updater"
crate-type = ["staticlib", "rlib"]

[dependencies]
atlas-core = { path = "../../crates/atlas-core", features = ["flatpak"] }
atlas-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "3311a9e5d3a69071e79d03be2b88fa34a6f7e5fb" }
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Release notes: parsed here, rendered by notes.rs from an allow-list.
pulldown-cmark = { version = "0.13", default-features = false }
# Release notes: small blocking client, run on a worker thread.
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
cxx-qt-build = "0.10"
