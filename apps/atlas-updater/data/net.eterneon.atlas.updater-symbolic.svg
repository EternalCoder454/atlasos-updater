<svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 22 22">
  <!-- The app icon's two arrows, one colour, in the 16 px middle of a 22 px
       tray icon like Breeze's. Plasma paints ColorScheme-Text in the panel's
       text colour, so it suits AtlasOS Light and Dark. -->
  <style id="current-color-scheme" type="text/css">.ColorScheme-Text { color:#232629; }</style>
  <g class="ColorScheme-Text" transform="translate(3.6 3) scale(0.2222) translate(-33 -28)">
    <g fill="none" stroke="currentColor" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 90.5 50 A 30 30 0 0 0 38 41"/>
      <path d="M 37.5 78 A 30 30 0 0 0 90 87"/>
    </g>
    <g fill="currentColor">
      <path d="M 95 28 L 95 54 L 69 54 Z" transform="rotate(8 90 48)"/>
      <path d="M 33 100 L 33 74 L 59 74 Z" transform="rotate(8 38 80)"/>
    </g>
  </g>
</svg>
