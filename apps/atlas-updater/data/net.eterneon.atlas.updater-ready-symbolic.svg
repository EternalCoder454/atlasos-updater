  <mask id="cut" maskUnits="userSpaceOnUse" x="0" y="0" width="22" height="22">
    <rect width="22" height="22" fill="#fff"/>
    <circle cx="17" cy="5" r="5" fill="#000"/>
  </mask>
  <g mask="url(#cut)">
