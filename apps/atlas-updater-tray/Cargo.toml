[package]
name = "atlas-updater-tray"
description = "Atlas Updater's tray: the update schedule, notifications and the panel icon, without Qt"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Resident all session, so it stays small: no Qt, no libflatpak. App rounds
# run in short-lived `atlas-updater --worker` processes; the window is a
# separate process too.

[dependencies]
atlas-updater-base = { path = "../../crates/atlas-updater-base" }
# Pinned to a release tag (Cargo.lock holds its commit: build with
# --locked); move it forward on purpose, together with the other crates'.
atlas-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.3.0" }
atlas-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.3.0" }
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "time", "sync", "net", "macros"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
