<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128">
  <title>Telamon Updater</title>
  <!-- Green circular arrows turning around a Telamon violet down arrow. Part
       of the Telamon app icons: no tile, own hue, same corners, light
       and shadow. -->
  <defs>
    <radialGradient id="shadow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#000000" stop-opacity="0.26"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" gradientUnits="userSpaceOnUse" x1="0" y1="14" x2="0" y2="110">
      <stop offset="0" stop-color="#5EDB8A"/>
      <stop offset="1" stop-color="#1FA45A"/>
    </linearGradient>
    <linearGradient id="arrow" gradientUnits="userSpaceOnUse" x1="0" y1="38" x2="0" y2="88">
      <stop offset="0" stop-color="#8A7AF4"/>
      <stop offset="1" stop-color="#5B4BD8"/>
    </linearGradient>
  </defs>
  <g transform="translate(64 64) scale(1.06) translate(-64 -64)">
    <ellipse cx="64" cy="114" rx="46" ry="6" fill="url(#shadow)"/>
    <path fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round" d="M24.5 47.6A42 42 0 0 1 95.2 33.9"/>
    <path fill="none" stroke="url(#ring)" stroke-width="13" stroke-linecap="round" d="M103.5 76.4A42 42 0 0 1 32.8 90.1"/>
    <path fill="url(#ring)" stroke="url(#ring)" stroke-width="4" stroke-linejoin="round" d="M110.9 51.3L107.1 18L78.1 44Z"/>
    <path fill="url(#ring)" stroke="url(#ring)" stroke-width="4" stroke-linejoin="round" d="M17.1 72.7L20.9 106L49.9 80Z"/>
    <path fill="none" stroke="url(#arrow)" stroke-width="11" stroke-linecap="round" stroke-linejoin="round" d="M64 42V79M49 66L64 81L79 66"/>
  </g>
</svg>
