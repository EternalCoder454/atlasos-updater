[package]
name = "atlas-app-template"
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.85"
description = "Starting point for Atlas apps: Kirigami + CXX-Qt + atlas-core"

# The template is not part of the atlas-updater workspace; it builds on its own.
[workspace]

[lib]
name = "atlas_app_template"
crate-type = ["staticlib"]

[dependencies]
cxx = "1"
cxx-qt = "0.10"
cxx-qt-lib = "0.10"
# In this repo atlas-core is a path dependency. Once the template is copied to
# its own repo, use the git form instead:
#   atlas-core = { git = "https://github.com/EternalCoder454/atlasos-updater", package = "atlas-core" }
atlas-core = { path = "../crates/atlas-core" }

[build-dependencies]
cxx-qt-build = "0.10"

[profile.release]
lto = "thin"
codegen-units = 4
strip = true
