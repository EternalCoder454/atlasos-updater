[package]
name = "telamon-updater-core"
description = "What Telamon Updater and Settings' Updates page share, without Qt: Flatpak app updates, firmware, release notes, history, the app update worker"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# Telamon Settings' Updates page (the QObject around this) and the
# `telamon-updater --worker` jobs the tray starts both use it. libflatpak is
# linked here, so the resident tray (telamon-updater-tray) does not depend on
# this crate: it stays a few MB.

[features]
# Honour TELAMON_UPDATER_FIXTURES in a release build (screenshots, UI tests).
fixtures = ["telamon-updater-base/fixtures"]

[dependencies]
telamon-update-engine = { path = "../telamon-update-engine" }
telamon-updater-base = { path = "../telamon-updater-base" }
# Pinned to a release tag (Cargo.lock holds its commit: build with --locked);
# move it forward on purpose, together with the other crates'.
telamon-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
telamon-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
telamon-framework-flatpak = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.0" }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
# Release notes: parsed here, rendered by notes.rs from an allow-list.
pulldown-cmark = { version = "0.13", default-features = false }
# Release notes: small blocking client, run on a worker thread.
ureq = { version = "3", default-features = false, features = ["rustls"] }
# Firmware download checks (SHA-256, and SHA-1 when that is all a release gives).
ring = "0.17"

[dev-dependencies]
tempfile = "3"
