<!DOCTYPE busconfig PUBLIC "-//freedesktop//DTD D-BUS Bus Configuration 1.0//EN"
 "http://www.freedesktop.org/standards/dbus/1.0/busconfig.dtd">
<busconfig>
  <!-- The name the helper had until 0.3.0. The telamon-system-helper package
       still serves it, from the same process, for programs that have not
       moved (the OS image's own scripts, older apps). Remove with it. -->
  <policy user="root">
    <allow own="net.eterneon.atlas.SystemHelper"/>
  </policy>

  <!-- Anyone may call it; polkit decides who may do what. -->
  <policy context="default">
    <allow send_destination="net.eterneon.atlas.SystemHelper"
           send_interface="net.eterneon.atlas.SystemHelper1"/>
    <allow send_destination="net.eterneon.atlas.SystemHelper"
           send_interface="org.freedesktop.DBus.Introspectable"/>
    <allow send_destination="net.eterneon.atlas.SystemHelper"
           send_interface="org.freedesktop.DBus.Properties"/>
    <allow send_destination="net.eterneon.atlas.SystemHelper"
           send_interface="org.freedesktop.DBus.Peer"/>
  </policy>
</busconfig>
