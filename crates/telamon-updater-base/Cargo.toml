[package]
name = "telamon-updater-base"
description = "What Telamon Updater's window and its tray share: settings, schedule, status, restart, notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No Qt here: the tray (telamon-updater-tray) links this and stays small.

[features]
# Honour TELAMON_UPDATER_FIXTURES in a release build (screenshots, UI tests).
fixtures = []

[dependencies]
telamon-update-engine = { path = "../telamon-update-engine" }
# Pinned to a release tag (Cargo.lock holds its commit: build with
# --locked); move it forward on purpose, together with the other crates'.
telamon-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.2" }
telamon-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v2.0.2", features = ["notify"] }
libc = "0.2"
rustix = { version = "1", default-features = false, features = ["std", "fs"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
