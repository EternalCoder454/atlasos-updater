[package]
name = "atlas-updater-base"
description = "What Atlas Updater's window and its tray share: settings, schedule, status, restart, notifications"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

# No Qt here: the tray (atlas-updater-tray) links this and stays small.

[features]
# Honour ATLAS_UPDATER_FIXTURES in a release build (screenshots, UI tests).
fixtures = []

[dependencies]
atlas-update-engine = { path = "../atlas-update-engine" }
# Pinned to a release tag (Cargo.lock holds its commit: build with
# --locked); move it forward on purpose, together with the other crates'.
atlas-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.3.0" }
atlas-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.3.0", features = ["notify"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = { version = "0.9", default-features = false, features = ["parse", "serde"] }
tokio = { version = "1", features = ["rt", "time"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }

[dev-dependencies]
tempfile = "3"
