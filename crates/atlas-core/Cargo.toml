[package]
name = "atlas-core"
description = "Shared library and privileged system helper for Atlas apps on AtlasOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "atlas_core"

[[bin]]
name = "atlas-system-helper"
path = "src/bin/atlas-system-helper.rs"

[features]
default = []
# libflatpak wrapper (needs flatpak-devel and glib2-devel at build time)
flatpak = ["dep:libflatpak"]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }
libflatpak = { version = "0.7", optional = true }

[dev-dependencies]
tempfile = "3"
