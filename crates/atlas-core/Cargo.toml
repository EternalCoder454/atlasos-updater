[package]
name = "atlas-core"
description = "Shared library and privileged system helper for Atlas apps on AtlasOS"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "atlas_core"

[[bin]]
name = "atlas-system-helper"
path = "src/bin/atlas-system-helper.rs"

[features]
default = []
# libflatpak wrapper (needs flatpak-devel and glib2-devel at build time)
flatpak = ["dep:atlas-framework-flatpak"]

[dependencies]
# What Atlas apps share: crash reports, bootc status, history, events,
# os-release, Flatpak. Pinned: move the rev forward on purpose.
atlas-framework-core = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "3311a9e5d3a69071e79d03be2b88fa34a6f7e5fb" }
atlas-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "3311a9e5d3a69071e79d03be2b88fa34a6f7e5fb" }
atlas-framework-flatpak = { git = "https://github.com/EternalCoder454/atlas-framework", rev = "3311a9e5d3a69071e79d03be2b88fa34a6f7e5fb", optional = true }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# safe killpg (the helper's one unsafe block is the pre_exec that hands bootc its progress pipe)
rustix = { version = "1", default-features = false, features = ["std", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[dev-dependencies]
tempfile = "3"
# paused time for the progress throttle test
tokio = { version = "1", features = ["test-util"] }
