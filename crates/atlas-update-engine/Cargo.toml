[package]
name = "atlas-update-engine"
description = "Atlas Updater's update engine: the privileged system helper and its client"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[lib]
name = "atlas_update_engine"

[[bin]]
name = "atlas-system-helper"
path = "src/bin/atlas-system-helper.rs"

[dependencies]
# bootc status, history and events (shared with every Atlas app). Pinned:
# a release tag, Cargo.lock holds its commit (build with --locked). Move it
# forward on purpose, together with apps/atlas-updater's.
atlas-framework-system = { git = "https://github.com/EternalCoder454/atlas-framework", tag = "v1.6.0" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
# safe killpg (the helper's one unsafe block is the pre_exec that hands bootc its progress pipe)
rustix = { version = "1", default-features = false, features = ["std", "process"] }
zbus = { version = "5", default-features = false, features = ["tokio"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time", "sync", "signal"] }

[dev-dependencies]
tempfile = "3"
# paused time for the progress throttle test
tokio = { version = "1", features = ["test-util"] }
